<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Certificado de Voluntariado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .certificado {
            background: white;
            border: 10px solid gold;
            padding: 50px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 3px solid gold;
            padding-bottom: 10px;
        }
        .destaque {
            font-size: 24px;
            color: #e74c3c;
            margin: 20px 0;
        }
        .assinatura {
            margin-top: 50px;
            border-top: 2px solid #333;
            padding-top: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="certificado">
        <h1>🎓 Certificado de Voluntariado</h1>

        <p>Certificamos que</p>
        <div class="destaque"><strong>{{ usuario.nome }}</strong></div>
        <p>é oficialmente voluntário(a) da</p>
        <div class="destaque"><strong>{{ ong.nome }}</strong></div>

        <p>desde <strong>{{ voluntariado.data_inscricao.strftime('%d/%m/%Y') }}</strong></p>

        <p style="font-style: italic; margin-top: 30px;">
            "Juntos fazemos a diferença na comunidade!"
        </p>

        <div class="assinatura">
            <p>________________________________</p>
            <p>Diretor(a) {{ ong.nome }}</p>
        </div>
    </div>
</body>
</html>
