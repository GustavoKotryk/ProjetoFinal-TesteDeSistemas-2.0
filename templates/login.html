{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">
        <i class="fas fa-sign-in-alt text-green-600 mr-2"></i>
        Entrar
    </h2>

    <form method="POST" class="space-y-6">
        <!-- Tipo de Usuário -->
        <div>
            <label class="block text-gray-700 mb-2">
                <i class="fas fa-user-tag mr-2"></i>Eu sou:
            </label>
            <div class="grid grid-cols-2 gap-4">
                <label class="flex items-center justify-center p-4 border-2 border-green-200 rounded-lg cursor-pointer hover:bg-green-50 transition has-[:checked]:bg-green-100 has-[:checked]:border-green-500">
                    <input type="radio" name="tipo" value="usuario" checked class="hidden">
                    <div class="text-center">
                        <i class="fas fa-user text-2xl text-green-600 mb-2"></i>
                        <p class="font-semibold">Voluntário</p>
                    </div>
                </label>
                <label class="flex items-center justify-center p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition has-[:checked]:bg-gray-100 has-[:checked]:border-gray-500">
                    <input type="radio" name="tipo" value="ong" class="hidden">
                    <div class="text-center">
                        <i class="fas fa-building text-2xl text-gray-600 mb-2"></i>
                        <p class="font-semibold">ONG</p>
                    </div>
                </label>
            </div>
        </div>

        <!-- Email -->
        <div>
            <label class="block text-gray-700 mb-2" for="email">
                <i class="fas fa-envelope mr-2"></i>Email
            </label>
            <input type="email" id="email" name="email" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
        </div>

        <!-- Senha -->
        <div>
            <label class="block text-gray-700 mb-2" for="senha">
                <i class="fas fa-lock mr-2"></i>Senha
            </label>
            <input type="password" id="senha" name="senha" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
        </div>

        <button type="submit"
            class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition font-semibold">
            <i class="fas fa-sign-in-alt mr-2"></i>Entrar
        </button>
    </form>

    <div class="mt-6 text-center space-y-3">
        <p class="text-gray-600">
            Não tem conta?
            <a href="{{ url_for('cadastro_usuario') }}" class="text-green-600 hover:text-green-700 font-semibold">
                Cadastre-se como voluntário
            </a>
        </p>
        <p class="text-gray-600">
            É uma ONG?
            <a href="{{ url_for('cadastro_ong') }}" class="text-green-600 hover:text-green-700 font-semibold">
                Cadastre sua organização
            </a>
        </p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const radioLabels = document.querySelectorAll('label[for]');
    radioLabels.forEach(label => {
        label.addEventListener('click', function() {
            radioLabels.forEach(l => {
                l.classList.remove('border-green-500', 'bg-green-100');
                l.classList.add('border-gray-200');
            });
            this.classList.add('border-green-500', 'bg-green-100');
            this.classList.remove('border-gray-200');
        });
    });
});
</script>
{% endblock %}
