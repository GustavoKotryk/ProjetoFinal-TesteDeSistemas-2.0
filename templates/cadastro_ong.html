{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md p-8">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">
        <i class="fas fa-building text-green-600 mr-2"></i>
        Cadastro de ONG
    </h2>

    <form method="POST" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Nome da ONG -->
            <div class="md:col-span-2">
                <label class="block text-gray-700 mb-2" for="nome">
                    <i class="fas fa-building mr-2"></i>Nome da ONG
                </label>
                <input type="text" id="nome" name="nome" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>

            <!-- Email -->
            <div>
                <label class="block text-gray-700 mb-2" for="email">
                    <i class="fas fa-envelope mr-2"></i>Email
                </label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>

            <!-- CNPJ -->
            <div>
                <label class="block text-gray-700 mb-2" for="cnpj">
                    <i class="fas fa-id-card mr-2"></i>CNPJ
                </label>
                <input type="text" id="cnpj" name="cnpj"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>

            <!-- Senha -->
            <div>
                <label class="block text-gray-700 mb-2" for="senha">
                    <i class="fas fa-lock mr-2"></i>Senha
                </label>
                <input type="password" id="senha" name="senha" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>

            <!-- Telefone -->
            <div>
                <label class="block text-gray-700 mb-2" for="telefone">
                    <i class="fas fa-phone mr-2"></i>Telefone
                </label>
                <input type="tel" id="telefone" name="telefone"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>

            <!-- Endereço -->
            <div class="md:col-span-2">
                <label class="block text-gray-700 mb-2" for="endereco">
                    <i class="fas fa-map-marker-alt mr-2"></i>Endereço
                </label>
                <input type="text" id="endereco" name="endereco"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>

            <!-- Cidade e Estado -->
            <div>
                <label class="block text-gray-700 mb-2" for="cidade">
                    <i class="fas fa-city mr-2"></i>Cidade
                </label>
                <input type="text" id="cidade" name="cidade" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>

            <div>
                <label class="block text-gray-700 mb-2" for="estado">
                    <i class="fas fa-map-pin mr-2"></i>Estado
                </label>
                <select id="estado" name="estado" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                    <option value="">Selecione...</option>
                    {% for uf in ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'] %}
                    <option value="{{ uf }}">{{ uf }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Coordenadas (para mapa) -->
            <div>
                <label class="block text-gray-700 mb-2" for="latitude">
                    <i class="fas fa-globe-americas mr-2"></i>Latitude
                </label>
                <input type="number" step="any" id="latitude" name="latitude"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                    placeholder="-23.5505">
            </div>

            <div>
                <label class="block text-gray-700 mb-2" for="longitude">
                    <i class="fas fa-globe-americas mr-2"></i>Longitude
                </label>
                <input type="number" step="any" id="longitude" name="longitude"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                    placeholder="-46.6333">
            </div>

            <!-- Descrição -->
            <div class="md:col-span-2">
                <label class="block text-gray-700 mb-2" for="descricao">
                    <i class="fas fa-file-alt mr-2"></i>Descrição da ONG
                </label>
                <textarea id="descricao" name="descricao" rows="4"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                    placeholder="Descreva o trabalho da sua organização..."></textarea>
            </div>

            <!-- Causas -->
            <div class="md:col-span-2">
                <label class="block text-gray-700 mb-2">
                    <i class="fas fa-heart mr-2"></i>Causas que atende
                </label>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    {% for causa in ['Educação', 'Meio Ambiente', 'Saúde', 'Animais', 'Idosos', 'Crianças', 'Pobreza', 'Cultura'] %}
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" name="causas" value="{{ causa }}"
                            class="rounded text-green-600 focus:ring-green-500">
                        <span class="text-gray-700">{{ causa }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
        </div>

        <button type="submit"
            class="w-full bg-gray-800 text-white py-3 rounded-lg hover:bg-gray-900 transition font-semibold">
            <i class="fas fa-building mr-2"></i>Cadastrar ONG
        </button>
    </form>

    <div class="mt-6 text-center">
        <p class="text-gray-600">
            É um voluntário?
            <a href="{{ url_for('cadastro_usuario') }}" class="text-green-600 hover:text-green-700 font-semibold">
                Cadastre-se aqui
            </a>
        </p>
    </div>
</div>
{% endblock %}
